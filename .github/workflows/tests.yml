name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-model:
    name: ${{ matrix.suite }} / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    # local-preview runs 3 to 5 minutes on a runner (its 20,000-frame step
    # alone took 148 s on a slow one): it gets 10.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node the project supports (package.json engines), and the newest LTS.
        node: ['22.18', 24]
        suite: [local-preview]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # The room server is the Workers under wrangler dev (test/support/workerd.ts),
      # run by the matrix's Node like the suite and the relay helpers it starts.
      - run: npm install --no-package-lock --ignore-scripts
      # Each suite gets its own runner; servers and installer fixtures are local.
      # No secrets needed.
      # teams (the sign-in page's Continue) and local-preview (preview windows,
      # WebRTC) drive a headless browser the runner image has, and print SKIP
      # for those checks where they find none. With both Chrome and Firefox,
      # local-preview takes 3 to 5 minutes, inside its own timeout above.
      # The plugin's own tests (plugin/tests: band.test.tsx, window.test.ts,
      # preview.test.ts, proxy.test.ts, upstream.test.ts) need Claude Code and
      # run with `claude plugin test plugin`, not here; see CONTRIBUTING.md.
      - run: node test/${{ matrix.suite }}.ts

  vitest:
    name: vitest / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18', 24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm install --no-package-lock --ignore-scripts
      # The suites moved to Vitest (test/*.test.ts, vitest.config.ts), checked
      # strictly first; the others run above until they move.
      - run: npm run typecheck:test
      - run: npm test

  server-types:
    name: server types
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      # tsc checks the server's TypeScript strictly against the Worker's types
      # alone (wrangler writes them from wrangler.toml; it needs no login). The
      # tools' versions are package.json's, pinned exactly, so a local run sees
      # the same types.
      - run: npm install --no-package-lock --ignore-scripts
      # npm run check: every type check (server, scripts, the relay helpers, test), oxlint's,
      # type-aware (a promise nobody awaits or catches fails it, .oxlintrc.json), and
      # oxfmt's check of server/ and scripts/ (.oxfmtrc.json).
      - run: npm run check
