name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-model:
    name: ${{ matrix.suite }} / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
        suite: [setup, teams, tcp-worker, local-preview, previews, peer, mailbox, browser-proxy, discover, security, cloud]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # The room server is the Workers under wrangler dev (test/support/workerd.mjs),
      # which needs Node 22+: installed with Node 24 and run by it (WRANGLER_NODE),
      # while the suite and the relay helpers it starts run on the matrix's Node.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: echo "WRANGLER_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - run: npm install --no-package-lock --ignore-scripts
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # Each suite gets its own runner; servers and installer fixtures are local.
      # No secrets needed.
      # teams (the sign-in page's Continue) and local-preview (preview windows,
      # WebRTC) drive a headless browser the runner image has, and print SKIP
      # for those checks where they find none. With both Chrome and Firefox,
      # local-preview takes about a minute, well inside the timeout.
      # The plugin's own tests (plugin/tests: band.test.tsx, window.test.ts,
      # preview.test.ts, proxy.test.ts, upstream.test.ts) need Claude Code and
      # run with `claude plugin test plugin`, not here; see CONTRIBUTING.md.
      - run: node test/${{ matrix.suite }}.mjs

  server-types:
    name: server types
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      # tsc checks the server against the Worker's types alone (wrangler writes
      # them from wrangler.toml; it needs no login): server/*.mjs (checkJs) with
      # what they import, then server/core and server/traces, the TypeScript,
      # strictly. The tools' versions are package.json's, pinned exactly, so a
      # local run sees the same types.
      - run: npm install --no-package-lock --ignore-scripts
      - run: npm run typecheck:server
