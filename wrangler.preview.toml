# The preview host name: the same script as wrangler.toml, every path served
# as the host's app (see server/worker/app.ts):
#   npx wrangler deploy -c wrangler.preview.toml
# On an update, deploy this before the main Worker: the main Worker's rooms
# name themselves in preview links by a key only this version routes, and
# this version still routes what older rooms made. The first time, deploy it
# after: its ROOMS binding needs the main Worker's rooms to exist.
# scripts/setup.ts deploy does both in that order.
name = "claude-share-preview"
main = "server/worker/index.ts"
compatibility_date = "2026-04-01"
# Session traces' Postgres driver (pg, through Hyperdrive) needs Node's APIs.
compatibility_flags = ["nodejs_compat"]
# Optional, and recommended: a host name of its own for each room's previews,
# on a domain of its own whose DNS has a proxied `*` record (a person adds
# it in the dashboard; docs/guide.md, "A host name per room"), with
# PREVIEW_URL below and the same in wrangler.toml.
# routes = [{ pattern = "*.example-previews.dev/*", zone_name = "example-previews.dev" }]

[vars]
ROLE = "preview"
# PREVIEW_URL = "https://*.example-previews.dev"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomObject"
script_name = "claude-share"
