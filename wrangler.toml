name = "claude-share"
main = "server/worker.mjs"
compatibility_date = "2026-04-01"
# Session traces' Postgres driver (pg, through Hyperdrive) needs Node's APIs.
compatibility_flags = ["nodejs_compat"]

[vars]
# "off" stops new rooms at once (joining existing links still works):
#   npx wrangler deploy --var NEW_ROOMS:off
NEW_ROOMS = "on"
# New rooms the whole server makes in a day (default 3000).
MAX_ROOMS_PER_DAY = "3000"
# Optional: pin the origin share links use (otherwise the request's own).
# PUBLIC_URL = "https://share.example.com"
# Optional: where previews are served (otherwise this Worker's workers.dev
# name with -preview). A wildcard gives each room's previews a host name of
# its own; set the same in wrangler.preview.toml (docs/guide.md).
# PREVIEW_URL = "https://*.example-previews.dev"
# Secret, for ending a room that's being abused (POST /api/admin/rooms/<id>/end):
#   npx wrangler secret put ADMIN_TOKEN

# What one network address or one room may do (server/core/limits.ts LIMITS says the same).
[[ratelimits]]
name = "CREATE_LIMIT"
namespace_id = "7101"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "JOIN_LIMIT"
namespace_id = "7102"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "EVENTS_LIMIT"
namespace_id = "7103"
simple = { limit = 900, period = 60 }

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomObject"

# Counts new rooms exactly (per address, and per day for the whole server).
[[durable_objects.bindings]]
name = "GATE"
class_name = "GateObject"

# Accounts and teams (server/teams.ts). Sign-in needs secrets:
#   npx wrangler secret put GITHUB_CLIENT_ID   (and GITHUB_CLIENT_SECRET)
#   npx wrangler secret put GOOGLE_CLIENT_ID   (and GOOGLE_CLIENT_SECRET)
[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "DirectoryObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomObject"]

# v2 and v3: a second store tried and removed (October 2026); kept so
# deployments that ran them stay in step.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["SharedRoom"]

[[migrations]]
tag = "v3"
deleted_classes = ["SharedRoom"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["GateObject"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["DirectoryObject"]

# Sessions kept running in the cloud (docs/cloud-host.md): a container a room,
# running Claude Code with the plugin. The image (cloud/Dockerfile) is built
# once and kept in this account's registry, so deploying needs no Docker:
# `node scripts/push-image.mjs` builds, pushes and names a new one after
# cloud/ changes. Deploying to another account, scripts/setup.mjs builds it
# from cloud/Dockerfile instead (Docker with buildx). Needs Workers Paid.
[[containers]]
class_name = "HostContainer"
image = "registry.cloudflare.com/831c9975a9f88831d7644e488ced7c79/claude-share-host:r-475eb1dda4"
max_instances = 20
instance_type = "standard-1"

[[durable_objects.bindings]]
name = "HOSTS"
class_name = "HostContainer"

[[migrations]]
tag = "v6"
new_sqlite_classes = ["HostContainer"]
