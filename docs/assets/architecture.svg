<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3180 2080" width="1100" role="img" aria-labelledby="t d">
<title id="t">Shared Sessions architecture</title>
<desc id="d">The host and guests run Claude Code with the plugin and talk to the room server on Cloudflare: a main Worker and a preview Worker in front of Durable Objects for rooms, accounts and teams, the daily room count and the cloud host, with traces in Postgres.</desc>
